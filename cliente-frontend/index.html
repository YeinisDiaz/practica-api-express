<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Libros - Práctica 3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body{font-family:Arial;padding:20px;background:#f0f2f5}
       .contenedor{max-width:900px;margin:auto;background:white;padding:25px;border-radius:12px}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th,td{border:1px solid #ddd;padding:10px}
        th{background:#3498db;color:white}
       .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📚 Dashboard de Libros</h1>
        <p>Consumiendo: http://localhost:3000/api/recursos</p>
        <table id="tabla">
            <thead><tr><th>ID</th><th>Nombre</th><th>Autor</th><th>Año</th></tr></thead>
            <tbody><tr><td colspan="4">Cargando...</td></tr></tbody>
        </table>
        <div class="grid">
            <div><h3>Libros por Año</h3><canvas id="miGrafica"></canvas></div>
            <div><h3>Libros por Autor</h3><canvas id="miGraficaPie"></canvas></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
